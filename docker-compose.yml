services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: getrdone
      POSTGRES_PASSWORD: getrdone
      POSTGRES_DB: getrdone
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    # Lets other services (the app, added in the Ship milestone) wait until
    # Postgres actually accepts connections, not just until the container starts.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U getrdone -d getrdone']
      interval: 2s
      timeout: 5s
      retries: 15

  # A separate, throwaway database for the API e2e tests. Its data lives in
  # memory (tmpfs), so tests can never touch dev data and a restart wipes it.
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: getrdone
      POSTGRES_PASSWORD: getrdone
      POSTGRES_DB: getrdone_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U getrdone -d getrdone_test']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
