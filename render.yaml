# Render Blueprint for the hosted demo: one web service built from the
# Dockerfile. The database is Neon Postgres (created separately); its
# connection string is pasted into DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: getrdone
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # From Neon: Dashboard → Connection string (it includes sslmode=require).
      - key: DATABASE_URL
        sync: false
      # Render generates a random secret once and keeps it.
      - key: JWT_SECRET
        generateValue: true
