# Render Blueprint for the hosted demo: one web service built from the
# Dockerfile. The database is Neon Postgres (project set up with the Neon
# CLI, see neon.ts); its two connection strings are pasted into the Render
# dashboard, with the same names `neon deploy` writes to .env.local.
services:
  - type: web
    name: getrdone
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Pooled connection (host ends in -pooler): the app's queries.
      - key: DATABASE_URL
        sync: false
      # Direct connection: `prisma migrate deploy` on start-up.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Render generates a random secret once and keeps it.
      - key: JWT_SECRET
        generateValue: true
